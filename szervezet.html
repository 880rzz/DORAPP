<!doctype html><html lang="hu-AT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Szervezet | Magyar Programok Ausztriában</title><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css?v=20260925-1"></head><body><header class="topbar"><div class="wrap navrow"><a class="brand" href="./"><span class="mark">AT×HU</span><span>Magyar Programok Ausztriában</span></a><nav><a href="./#terkep">Térkép</a><a href="./#naptar">Események</a></nav></div></header><main><section class="hero"><div class="wrap" id="profile"><div class="eyebrow">Szervezeti profil</div><h1>Betöltés…</h1></div></section><section class="section"><div class="wrap"><div class="event-grid" id="relatedEvents"></div></div></section></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const id=new URLSearchParams(location.search).get("id");Promise.all([fetch("data/organizations.json").then(r=>r.json()),fetch("data/events.json").then(r=>r.json()).catch(()=>({events:[]}))]).then(([db,ev])=>{const o=db.organizations.find(x=>x.id===id);if(!o){document.querySelector("#profile").innerHTML="<h1>A szervezet nem található.</h1>";return}document.title=o.name+" | Magyar Programok Ausztriában";document.querySelector("#profile").innerHTML='<div class="eyebrow">'+esc(db.states.find(s=>s.id===o.state)?.name||o.state)+' · '+esc(o.city)+' · '+esc(o.type)+'</div><h1>'+esc(o.name)+'</h1><p class="lead">'+esc(o.intro)+'</p><div class="hero-actions">'+(o.website?'<a class="btn primary" target="_blank" rel="noopener external" href="'+esc(o.website)+'">Hivatalos weboldal ↗</a>':'')+(o.facebook?'<a class="btn" target="_blank" rel="noopener external" href="'+esc(o.facebook)+'">Facebook ↗</a>':'')+(o.instagram?'<a class="btn" target="_blank" rel="noopener external" href="'+esc(o.instagram)+'">Instagram ↗</a>':'')+'</div><div class="hero-note" style="margin-top:32px"><b>Elsődleges eseményfelületek</b><p>'+(o.eventSources?.length?o.eventSources.map(u=>'<a target="_blank" rel="noopener external" href="'+esc(u)+'">'+esc(u)+'</a>').join('<br>'):'Még nincs igazolt, géppel olvasható eseményforrás rögzítve.')+'</p></div>';const es=(ev.events||[]).filter(e=>e.organizationId===o.id);document.querySelector("#relatedEvents").innerHTML=es.map(e=>'<article class="event"><div class="date">'+esc(e.startDate||"")+'</div><h3>'+esc(e.name)+'</h3><p>'+esc(e.venue||e.city||"")+'</p><a href="'+esc(e.sourceUrl||"#")+'" target="_blank" rel="noopener external">Forrás ↗</a></article>').join("")||'<div class="empty">Jelenleg nincs publikált közelgő esemény ehhez a szervezethez.</div>'});</script></body></html>
