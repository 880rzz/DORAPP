name: Deploy DORAPP to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate static app
        run: |
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/events.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/education.json >/dev/null
          python -m json.tool data/education-site-health.json >/dev/null
          python -m py_compile scripts/update_events.py scripts/update_articles.py scripts/audit_education_sites.py scripts/validate_directory.py scripts/generate_profiles.py scripts/generate_education_profiles.py scripts/generate_sitemap.py scripts/generate_reference_pages.py scripts/submit_indexnow.py
          node --check app.js
          python scripts/validate_directory.py
          python scripts/generate_profiles.py
          python scripts/generate_education_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
      - name: Persist generated profiles and sitemap
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json)" ]; then
            echo "Generated static output already current"
          else
            git config user.name "dorapp-static-builder[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json
            git commit -m "chore(static): refresh generated profiles"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Generated-output push race (attempt $attempt); rebuilding on latest main..."
              git fetch origin main
              git reset --hard origin/main
              python scripts/validate_directory.py
              python scripts/generate_profiles.py
              python scripts/generate_education_profiles.py
              python scripts/generate_reference_pages.py
              python scripts/generate_sitemap.py
              git add sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json
              if git diff --cached --quiet; then
                echo "Generated output already current after refresh"
                break
              fi
              git commit -m "chore(static): refresh generated profiles"
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to persist generated output after 3 attempts"
                exit 1
              fi
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about changed public URLs
        if: success()
        continue-on-error: true
        run: python scripts/submit_indexnow.py
