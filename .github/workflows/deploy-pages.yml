name: Deploy DORAPP to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Install country geography dependency
        run: python -m pip install pycountry==24.6.1 pyshp==2.3.1
      - name: Validate static app
        run: |
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/events.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/education.json >/dev/null
          python -m json.tool data/education-site-health.json >/dev/null
          python scripts/generate_global_compat.py
          python -m json.tool data/global.json >/dev/null
          python scripts/generate_global_search_index.py
          python scripts/generate_global_calendar.py
          python -m json.tool data/global-search-index.json >/dev/null
          python -m json.tool data/global-events.json >/dev/null
          python scripts/generate_country_region_maps.py
          python scripts/generate_country_pages.py
          python scripts/generate_global_profiles.py
          python scripts/generate_global_education_profiles.py
          python scripts/generate_global_event_profiles.py
          python scripts/validate_global.py
          python -m py_compile scripts/update_events.py scripts/update_articles.py scripts/audit_education_sites.py scripts/validate_directory.py scripts/validate_global.py scripts/generate_global_compat.py scripts/generate_global_search_index.py scripts/generate_global_calendar.py scripts/generate_country_region_maps.py scripts/generate_country_pages.py scripts/generate_global_profiles.py scripts/generate_global_education_profiles.py scripts/generate_global_event_profiles.py scripts/global_country_research.py scripts/enrich_country_registry.py scripts/verify_discovery_candidates.py scripts/verify_first_party_sites.py scripts/promote_verified_entities.py scripts/audit_global_source_health.py scripts/validate_static_output.py scripts/generate_profiles.py scripts/generate_education_profiles.py scripts/generate_sitemap.py scripts/generate_reference_pages.py scripts/submit_indexnow.py
          node --check app.js
          node --check country.js
          node --check ui.js
          python scripts/validate_directory.py
          python scripts/generate_profiles.py
          python scripts/generate_education_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
          python scripts/validate_static_output.py
      - name: Persist generated profiles and sitemap
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html data/global.json data/global-search-index.json data/global-events.json data/countries countries assets/maps)" ]; then
            echo "Generated static output already current"
          else
            git config user.name "dorapp-static-builder[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html data/global.json data/global-search-index.json data/global-events.json data/countries countries assets/maps
            git commit -m "chore(static): refresh generated profiles"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Generated-output push race (attempt $attempt); rebuilding on latest main..."
              git fetch origin main
              git reset --hard origin/main
              python scripts/validate_directory.py
              python scripts/generate_profiles.py
              python scripts/generate_education_profiles.py
              python scripts/generate_reference_pages.py
              python scripts/generate_sitemap.py
              git add sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html
              if git diff --cached --quiet; then
                echo "Generated output already current after refresh"
                break
              fi
              git commit -m "chore(static): refresh generated profiles"
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to persist generated output after 3 attempts"
                exit 1
              fi
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about changed public URLs
        if: success()
        continue-on-error: true
        run: python scripts/submit_indexnow.py
