name: Validate and persist DORAPP static build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: dorapp-generated-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install country geography dependency
        run: python -m pip install pycountry==24.6.1 pyshp==2.3.1
      - name: Validate static app
        run: |
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/events.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/education.json >/dev/null
          python -m json.tool data/education-site-health.json >/dev/null
          python scripts/generate_global_compat.py
          python -m json.tool data/global.json >/dev/null
          python scripts/generate_global_search_index.py
          python scripts/generate_global_calendar.py
          python -m json.tool data/global-search-index.json >/dev/null
          python -m json.tool data/global-events.json >/dev/null
          python scripts/generate_country_region_maps.py
          python scripts/generate_country_pages.py
          python scripts/generate_global_profiles.py
          python scripts/generate_global_education_profiles.py
          python scripts/generate_global_event_profiles.py
          python scripts/validate_global.py
          python -m py_compile scripts/update_events.py scripts/update_country_events.py scripts/update_articles.py scripts/audit_education_sites.py scripts/validate_directory.py scripts/validate_global.py scripts/generate_global_compat.py scripts/generate_global_search_index.py scripts/generate_global_calendar.py scripts/generate_country_region_maps.py scripts/generate_country_pages.py scripts/generate_global_profiles.py scripts/generate_global_education_profiles.py scripts/generate_global_event_profiles.py scripts/global_country_research.py scripts/enrich_country_registry.py scripts/verify_discovery_candidates.py scripts/verify_first_party_sites.py scripts/promote_verified_entities.py scripts/audit_global_source_health.py scripts/audit_site_links.py scripts/audit_human_language.py scripts/audit_ecosystem_quality.py scripts/validate_static_output.py scripts/generate_profiles.py scripts/generate_education_profiles.py scripts/generate_sitemap.py scripts/generate_reference_pages.py scripts/submit_indexnow.py
          node --check app.js
          node --check country.js
          node --check ui.js
          python scripts/validate_directory.py
          python scripts/generate_profiles.py
          python scripts/generate_education_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
          python scripts/audit_site_links.py --no-write
          python scripts/audit_human_language.py
          python scripts/audit_ecosystem_quality.py
          python scripts/validate_static_output.py
      - name: Open generated-output PR
        run: |
          bash scripts/open_automation_pr.sh static "chore(static): review generated profiles" \
            sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak \
            entity.jsonld ai-entry.json adatminoseg.html data/global.json \
            data/global-search-index.json data/global-events.json data/countries countries assets/maps
