name: DORAPP production smoke

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/production-smoke.yml"]
  workflow_run:
    workflows: ["Validate and persist DORAPP static build", "pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dorapp-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify representative live routes and trust surfaces
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.diaszporaterkep.hu"
          work="$(mktemp -d)"
          fetch() {
            local route="$1"
            local output="$2"
            curl --fail --show-error --silent --location --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 60 -H "Cache-Control: no-cache" "${base}${route}?production-smoke=${{ github.run_id }}" -o "${work}/${output}"
            test -s "${work}/${output}"
          }

          fetch "/" "index.html"
          fetch "/countries/at/" "country-at.html"
          fetch "/forrasok.html" "forrasok.html"
          fetch "/adatminoseg.html" "adatminoseg.html"
          fetch "/design-editorial.css" "design-editorial.css"
          fetch "/ui.js" "ui.js"
          fetch "/world.js" "world.js"
          fetch "/data/global.json" "global.json"
          fetch "/data/global-search-index.json" "global-search-index.json"
          fetch "/data/global-events.json" "global-events.json"
          fetch "/country.js" "country.js"
          grep -Fq 'Country dataset unavailable' "${work}/country.js"
          python - "${work}" "${base}" "${{ github.run_id }}" <<'PY'
          import json, pathlib, subprocess, sys
          root, base, run_id=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          countries=json.loads((root/"global.json").read_text(encoding="utf-8"))["countries"]
          failures=[]
          absent=[]
          for country in countries:
              iso=country.get("iso2","").lower()
              if not iso: failures.append("missing iso2"); continue
              routes=[(f"/countries/{iso}/",("countryOrgGrid","country.js?","countryEventGrid"),False),
                      (f"/data/countries/{iso}/organizations.json",("organizations",),True),
                      (f"/data/countries/{iso}/education.json",("institutions",),True),
                      (f"/data/countries/{iso}/events.json",("events",),True)]
              for route,required,optional in routes:
                  url=base+route+"?production-smoke="+run_id
                  result=subprocess.run(["curl","--silent","--show-error","--location","--retry","2","--max-time","30","--write-out","\n%{http_code}",url],capture_output=True,text=True)
                  body,sep,status=result.stdout.rpartition("\n")
                  if result.returncode or not sep:
                      failures.append(f"{iso}: request failed {route}: {result.stderr[:120]}")
                      continue
                  if status=="404" and optional:
                      absent.append(route)
                      continue
                  if status!="200":
                      failures.append(f"{iso}: HTTP {status} {route}")
                      continue
                  if route.endswith(".json"):
                      try:
                          payload=json.loads(body)
                          if not isinstance(payload,dict) or not any(k in payload for k in required):
                              failures.append(f"{iso}: unexpected dataset shape {route}")
                      except ValueError: failures.append(f"{iso}: invalid JSON {route}")
                  elif not all(marker in body for marker in required):
                      failures.append(f"{iso}: missing country UI markers")
          print(f"Country pages checked: {len(countries)}; unpublished optional datasets: {len(absent)}")
          if absent:
              print("DATA COVERAGE GAPS (not verified empty):")
              print("\n".join(absent[:80]))
          if failures: raise SystemExit("Production country parity failed:\n"+"\n".join(failures[:40]))
          PY

          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/index.html"
          grep -Fq 'assets/world-map.svg' "${work}/index.html"
          grep -Fq 'Bécsi Magyar Iskola' "${work}/index.html"
          grep -Fq 'marketing@kozpontiszovetseg.at' "${work}/index.html"
          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/country-at.html"
          grep -Fq 'rel="canonical"' "${work}/country-at.html"
          grep -Fq 'application/ld+json' "${work}/country-at.html"
          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/forrasok.html"
          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/adatminoseg.html"
          grep -Fq -- '--accent:#245a81' "${work}/design-editorial.css"
          grep -Fq '.fit-text-very-long' "${work}/design-editorial.css"
          grep -Fq 'https://wa.me/4367761655592' "${work}/ui.js"
          grep -Fq 'background:#5f6368' "${work}/design-editorial.css"

          python - "${work}" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          registry=json.loads((root/"global.json").read_text())
          search=json.loads((root/"global-search-index.json").read_text())
          events=json.loads((root/"global-events.json").read_text())
          assert isinstance(registry.get("countries"),list) and len(registry["countries"]) >= 100, "Country registry missing or unexpectedly small"
          assert isinstance(search.get("items"),list), "Search index missing items"
          assert len(search["items"]) > 0, "Search index unexpectedly empty"
          assert isinstance(events.get("events"),list), "Calendar missing events"
          assert all(isinstance(e,dict) and e.get("name") and e.get("href") for e in events["events"]), "Invalid event cards"
          html=(root/"index.html").read_text()
          assert "world.js?" in html, "World application script missing"
          js=(root/"world.js").read_text()
          assert "function bindWorldMap" in js and "function renderOrganizations" in js, "Critical map/directory functions missing"
          print(f"production_smoke countries={len(registry['countries'])} search_items={len(search['items'])} events={len(events['events'])}")
          PY
          printf 'production_smoke routes=10 map=ok design=ok schema=ok footer=ok whatsapp=ok\n'
