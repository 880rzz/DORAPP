name: DORAPP production smoke

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dorapp-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify representative live routes and trust surfaces
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.diaszporaterkep.hu"
          work="$(mktemp -d)"
          fetch() {
            local route="$1"
            local output="$2"
            curl --fail --show-error --silent --location               --retry 12 --retry-all-errors --retry-delay 5               --connect-timeout 15 --max-time 60               -H "Cache-Control: no-cache"               "${base}${route}?production-smoke=${{ github.run_id }}"               -o "${work}/${output}"
            test -s "${work}/${output}"
          }

          fetch "/" "index.html"
          fetch "/countries/at/" "country-at.html"
          fetch "/forrasok.html" "forrasok.html"
          fetch "/adatminoseg.html" "adatminoseg.html"
          fetch "/design-editorial.css" "design-editorial.css"
          fetch "/ui.js" "ui.js"

          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/index.html"
          grep -Fq 'assets/world-map.svg' "${work}/index.html"
          grep -Fq 'Bécsi Magyar Iskola' "${work}/index.html"
          grep -Fq 'marketing@kozpontiszovetseg.at' "${work}/index.html"
          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/country-at.html"
          grep -Fq 'rel="canonical"' "${work}/country-at.html"
          grep -Fq 'application/ld+json' "${work}/country-at.html"
          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/forrasok.html"
          grep -Fq 'design-editorial.css?v=20261015-2' "${work}/adatminoseg.html"
          grep -Fq -- '--accent:#245a81' "${work}/design-editorial.css"
          grep -Fq '.fit-text-very-long' "${work}/design-editorial.css"
          grep -Fq 'https://wa.me/4367761655592' "${work}/ui.js"
          grep -Fq 'background:#5f6368' "${work}/design-editorial.css"

          printf 'production_smoke routes=6 map=ok design=ok schema=ok footer=ok whatsapp=ok\n'
