name: DORAPP Global Daily Steward

on:
  schedule:
    - cron: "17 0-1,3-23 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/countries/**"
      - "data/global.json"
      - ".github/workflows/global-daily-steward.yml"
      - "scripts/global_country_research.py"
      - "scripts/generate_global_compat.py"
      - "scripts/generate_global_search_index.py"
      - "scripts/generate_global_calendar.py"
      - "scripts/generate_country_region_maps.py"
      - "scripts/generate_country_pages.py"
      - "scripts/enrich_country_registry.py"
      - "scripts/verify_discovery_candidates.py"
      - "scripts/verify_first_party_sites.py"
      - "scripts/promote_verified_entities.py"
      - "scripts/generate_global_profiles.py"
      - "scripts/generate_global_education_profiles.py"
      - "scripts/generate_global_event_profiles.py"
      - "scripts/generate_reference_pages.py"
      - "scripts/generate_sitemap.py"
      - "scripts/validate_global.py"
      - "scripts/validate_directory.py"
      - "scripts/validate_static_output.py"
      - "scripts/audit_global_source_health.py"
      - "scripts/audit_site_links.py"
      - "scripts/audit_human_language.py"
      - "scripts/audit_ecosystem_quality.py"
      - "scripts/update_country_events.py"
      - "scripts/audit_global_press_sources.py"
      - "scripts/discover_global_press.py"
      - "scripts/validate_verified_zero.py"
      - "scripts/update_events.py"
      - "app.js"
      - "world.js"
      - "country.js"
      - "ui.js"
      - "styles.css"
      - "docs/content-ui-policy.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dorapp-global-main-v2
  cancel-in-progress: true

jobs:
  research:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(global): rotate diaspora research batch') }}"
    runs-on: ubuntu-latest
    env:
      RUN_EVENT_REFRESH: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'test(events):') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconcile with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install deterministic build dependencies
        run: python -m pip install --disable-pip-version-check pycountry==24.6.1 pyshp==2.3.1

      - name: Enrich country registry names
        run: python scripts/enrich_country_registry.py

      - name: Run deterministic country research batch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/global_country_research.py

      - name: Qualify discovery candidates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/verify_discovery_candidates.py

      - name: Verify first-party sites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/verify_first_party_sites.py

      - name: Promote location-verified entities
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/promote_verified_entities.py

      - name: Refresh country-scoped event sources
        if: env.RUN_EVENT_REFRESH == 'true'
        run: python scripts/update_country_events.py

      - name: Discover global press mentions for human verification
        if: env.RUN_EVENT_REFRESH == 'true'
        run: python scripts/discover_global_press.py

      - name: Audit global organization press-source coverage
        if: env.RUN_EVENT_REFRESH == 'true'
        run: python scripts/audit_global_press_sources.py

      - name: Enforce verified-zero evidence gate
        run: python scripts/validate_verified_zero.py

      - name: Audit canonical source health
        run: python scripts/audit_global_source_health.py

      - name: Rebuild global compatibility and validate
        run: |
          python scripts/generate_global_compat.py
          python scripts/generate_global_search_index.py
          python scripts/generate_global_calendar.py
          python scripts/generate_country_region_maps.py
          python scripts/generate_country_pages.py
          python scripts/generate_global_profiles.py
          python scripts/generate_global_education_profiles.py
          python scripts/generate_global_event_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
          python scripts/audit_site_links.py --check-external
          python scripts/generate_reference_pages.py
          python scripts/audit_site_links.py --no-write
          python scripts/audit_human_language.py
          python scripts/audit_ecosystem_quality.py
          python scripts/validate_global.py
          node --check app.js
          node --check world.js
          node --check country.js
          node --check ui.js
          python scripts/validate_directory.py
          python scripts/validate_static_output.py

      - name: Stage generated research artifacts for review
        id: changes
        shell: bash
        run: |
          git add data/global.json data/research-state.json data/verification-queue.json data/promotion-ready.json data/daily-runs data/countries data/global-search-index.json data/global-events.json data/link-audit.json data/human-language-audit.json data/ecosystem-quality-audit.json countries assets/maps sitemap.xml esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html
          if [ -f data/global-press-review-queue.json ]; then git add data/global-press-review-queue.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Propose validated research updates as pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DORAPP_PR_TOKEN || github.token }}
          commit-message: "chore(global): propose validated diaspora research batch"
          branch: automation/diaspora-research
          delete-branch: true
          title: "chore(global): reviewed diaspora research update"
          body: |
            Automatically generated research and source updates.
            Review country statuses, evidence, and organization/event/press candidates.
            Do not merge until Validate DORAPP passes.
          add-paths: |
            data/global.json
            data/research-state.json
            data/verification-queue.json
            data/promotion-ready.json
            data/global-press-review-queue.json
            data/daily-runs
            data/countries
            data/global-search-index.json
            data/global-events.json
            data/link-audit.json
            data/human-language-audit.json
            data/ecosystem-quality-audit.json
            countries
            assets/maps
            sitemap.xml
            esemenyek
            tartomanyok
            kategoriak
            entity.jsonld
            ai-entry.json
            adatminoseg.html
