name: DORAPP Global Daily Steward

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/countries/**"
      - "data/global.json"
      - ".github/workflows/global-daily-steward.yml"
      - "scripts/global_country_research.py"
      - "scripts/generate_global_compat.py"
      - "scripts/generate_global_search_index.py"
      - "scripts/generate_global_calendar.py"
      - "scripts/generate_country_region_maps.py"
      - "scripts/generate_country_pages.py"
      - "scripts/enrich_country_registry.py"
      - "scripts/verify_discovery_candidates.py"
      - "scripts/verify_first_party_sites.py"
      - "scripts/promote_verified_entities.py"
      - "scripts/generate_global_profiles.py"
      - "scripts/generate_global_education_profiles.py"
      - "scripts/generate_global_event_profiles.py"
      - "scripts/generate_reference_pages.py"
      - "scripts/generate_sitemap.py"
      - "scripts/validate_global.py"
      - "scripts/validate_directory.py"
      - "scripts/validate_static_output.py"
      - "scripts/audit_global_source_health.py"
      - "app.js"
      - "world.js"
      - "country.js"
      - "ui.js"

permissions:
  contents: write

concurrency:
  group: dorapp-global-${{ github.event_name }}-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconcile with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install deterministic build dependencies
        run: python -m pip install --disable-pip-version-check pycountry==24.6.1 pyshp==2.3.1

      - name: Enrich country registry names
        run: python scripts/enrich_country_registry.py

      - name: Run deterministic country research batch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/global_country_research.py

      - name: Qualify discovery candidates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/verify_discovery_candidates.py

      - name: Verify first-party sites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/verify_first_party_sites.py

      - name: Promote location-verified entities
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/promote_verified_entities.py

      - name: Audit canonical source health
        run: python scripts/audit_global_source_health.py

      - name: Rebuild global compatibility and validate
        run: |
          python scripts/generate_global_compat.py
          python scripts/generate_global_search_index.py
          python scripts/generate_global_calendar.py
          python scripts/generate_country_region_maps.py
          python scripts/generate_country_pages.py
          python scripts/generate_global_profiles.py
          python scripts/generate_global_education_profiles.py
          python scripts/generate_global_event_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
          python scripts/validate_global.py
          node --check app.js
          node --check world.js
          node --check country.js
          node --check ui.js
          python scripts/validate_directory.py
          python scripts/validate_static_output.py

      - name: Commit material changes safely
        run: |
          if [ -z "$(git status --porcelain -- data/global.json data/research-state.json data/verification-queue.json data/promotion-ready.json data/daily-runs data/countries data/global-search-index.json data/global-events.json countries assets/maps sitemap.xml esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html)" ]; then
            echo "No material global research changes"
            exit 0
          fi
          git config user.name "dorapp-global-steward[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/global.json data/research-state.json data/verification-queue.json data/promotion-ready.json data/daily-runs data/countries data/global-search-index.json data/global-events.json countries assets/maps sitemap.xml esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html
          git commit -m "chore(global): rotate diaspora research batch"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; rebuilding on latest main"
            git fetch origin main
            git reset --hard origin/main
            python scripts/enrich_country_registry.py
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python scripts/global_country_research.py
              python scripts/verify_discovery_candidates.py
              python scripts/verify_first_party_sites.py
              python scripts/promote_verified_entities.py
            fi
            python scripts/audit_global_source_health.py
            python scripts/generate_global_compat.py
            python scripts/generate_global_search_index.py
            python scripts/generate_global_calendar.py
            python scripts/generate_country_region_maps.py
            python scripts/generate_country_pages.py
            python scripts/generate_global_profiles.py
            python scripts/generate_global_education_profiles.py
            python scripts/generate_global_event_profiles.py
            python scripts/generate_reference_pages.py
            python scripts/generate_sitemap.py
            python scripts/validate_global.py
            node --check app.js
            node --check world.js
            node --check country.js
            node --check ui.js
            python scripts/validate_directory.py
            python scripts/validate_static_output.py
            git add data/global.json data/research-state.json data/verification-queue.json data/promotion-ready.json data/daily-runs data/countries data/global-search-index.json data/global-events.json countries assets/maps sitemap.xml esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html
            if git diff --cached --quiet; then
              echo "No material global changes remain after rebuild"
              exit 0
            fi
            git commit -m "chore(global): rotate diaspora research batch"
          done
          exit 1
