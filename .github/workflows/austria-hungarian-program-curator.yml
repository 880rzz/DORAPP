name: Austria Hungarian program daily curator
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/organizations.json"
      - "scripts/update_articles.py"
      - "scripts/update_events.py"
      - ".github/workflows/austria-hungarian-program-curator.yml"
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: austria-hungarian-program-curator-v2
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile curator
        run: python -m py_compile scripts/update_events.py scripts/update_articles.py scripts/validate_directory.py
      - name: Refresh verified event sources
        run: python scripts/update_events.py
      - name: Refresh organization articles
        run: python scripts/update_articles.py
      - name: Validate directory integrity
        run: python scripts/validate_directory.py
      - name: Validate JSON
        run: |
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/events.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/education.json >/dev/null
      - name: Commit source-backed changes
        run: |
          if git diff --quiet -- data/events.json data/source-health.json data/articles.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "austria-program-curator[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/source-health.json data/articles.json data/education-site-health.json
          git commit -m "chore(events): daily source-backed refresh"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict: rebuilding generated data on latest main"
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/update_events.py
              python scripts/update_articles.py
              python scripts/validate_directory.py
              python -m json.tool data/events.json >/dev/null
              python -m json.tool data/source-health.json >/dev/null
              python -m json.tool data/articles.json >/dev/null
              git add data/events.json data/source-health.json data/articles.json data/education-site-health.json
              if git diff --cached --quiet; then
                echo "No data changes remain after rebasing"
                exit 0
              fi
              git commit -m "chore(events): daily source-backed refresh"
            fi
          done
          echo "Unable to push curator refresh after 3 attempts"
          exit 1
