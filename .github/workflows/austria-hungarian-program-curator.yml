name: Austria Hungarian program daily curator
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/organizations.json"
      - "scripts/update_articles.py"
      - "scripts/update_events.py"
      - ".github/workflows/austria-hungarian-program-curator.yml"
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: austria-hungarian-program-curator-v2
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic build dependencies
        run: python -m pip install --disable-pip-version-check pycountry==24.6.1 pyshp==2.3.1
      - name: Compile curator
        run: python -m py_compile scripts/update_events.py scripts/update_articles.py scripts/validate_directory.py
      - name: Refresh verified event sources
        run: python scripts/update_events.py
      - name: Refresh organization articles
        run: python scripts/update_articles.py
      - name: Validate directory integrity
        run: python scripts/validate_directory.py
      - name: Validate JSON
        run: |
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/events.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/education.json >/dev/null
      - name: Rebuild and validate published output
        run: |
          python scripts/generate_global_compat.py
          python scripts/generate_global_search_index.py
          python scripts/generate_global_calendar.py
          python scripts/generate_country_region_maps.py
          python scripts/generate_country_pages.py
          python scripts/generate_global_profiles.py
          python scripts/generate_global_education_profiles.py
          python scripts/generate_global_event_profiles.py
          python scripts/generate_profiles.py
          python scripts/generate_education_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
          python scripts/validate_global.py
          python scripts/validate_static_output.py
      - name: Commit source-backed changes
        run: |
          if [ -z "$(git status --porcelain -- data/events.json data/source-health.json data/articles.json data/global.json data/global-search-index.json data/global-events.json data/countries countries assets/maps sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "austria-program-curator[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/source-health.json data/articles.json data/education-site-health.json data/global.json data/global-search-index.json data/global-events.json data/countries countries assets/maps sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html
          git commit -m "chore(events): daily source-backed refresh"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict: rebuilding generated data on latest main"
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/update_events.py
              python scripts/update_articles.py
              python scripts/validate_directory.py
              python -m json.tool data/events.json >/dev/null
              python -m json.tool data/source-health.json >/dev/null
              python -m json.tool data/articles.json >/dev/null
              python scripts/generate_global_compat.py
              python scripts/generate_global_search_index.py
              python scripts/generate_global_calendar.py
              python scripts/generate_country_region_maps.py
              python scripts/generate_country_pages.py
              python scripts/generate_global_profiles.py
              python scripts/generate_global_education_profiles.py
              python scripts/generate_global_event_profiles.py
              python scripts/generate_profiles.py
              python scripts/generate_education_profiles.py
              python scripts/generate_reference_pages.py
              python scripts/generate_sitemap.py
              python scripts/validate_global.py
              python scripts/validate_static_output.py
              git add data/events.json data/source-health.json data/articles.json data/education-site-health.json data/global.json data/global-search-index.json data/global-events.json data/countries countries assets/maps sitemap.xml szervezetek oktatas esemenyek tartomanyok kategoriak entity.jsonld ai-entry.json adatminoseg.html
              if git diff --cached --quiet; then
                echo "No data changes remain after rebasing"
                exit 0
              fi
              git commit -m "chore(events): daily source-backed refresh"
            fi
          done
          echo "Unable to push curator refresh after 3 attempts"
          exit 1
