name: Education website audit
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/education.json"
      - "scripts/audit_education_sites.py"
      - ".github/workflows/education-site-audit.yml"
  schedule:
    - cron: "41 4 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: dorapp-education-site-audit-v2
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate audit code and data
        run: |
          python -m py_compile scripts/audit_education_sites.py scripts/audit_taxonomy.py scripts/validate_directory.py
          python -m json.tool data/education.json >/dev/null
          python scripts/validate_directory.py
      - name: Audit every education website
        run: python scripts/audit_education_sites.py
      - name: Validate result
        run: python -m json.tool data/education-site-health.json >/dev/null
      - name: Rebuild and validate public audit output
        run: |
          python scripts/audit_taxonomy.py
          python scripts/generate_education_profiles.py
          python scripts/generate_reference_pages.py
          python scripts/generate_sitemap.py
          python scripts/validate_static_output.py
      - name: Propose education audit updates as pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DORAPP_PR_TOKEN || github.token }}
          commit-message: "chore(education): propose website audit refresh"
          branch: automation/education-site-audit
          delete-branch: true
          title: "chore(education): review website audit refresh"
          body: |
            Education website audit refresh for human review.
            No direct push to main.
          add-paths: |
            data/education-site-health.json
            data/taxonomy-audit.json
            oktatas
            esemenyek
            tartomanyok
            kategoriak
            entity.jsonld
            ai-entry.json
            adatminoseg.html
            sitemap.xml
