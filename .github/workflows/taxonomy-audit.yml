name: Taxonomy audit
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/organizations.json"
      - "data/education.json"
      - "data/events.json"
      - "scripts/audit_taxonomy.py"
      - ".github/workflows/taxonomy-audit.yml"
  schedule:
    - cron: "11 5 * * *"
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: dorapp-generated-data
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate code
        run: |
          python -m py_compile scripts/audit_taxonomy.py
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/education.json >/dev/null
          python -m json.tool data/events.json >/dev/null
      - name: Audit taxonomy against source pages
        run: python scripts/audit_taxonomy.py
      - name: Validate result
        run: python -m json.tool data/taxonomy-audit.json >/dev/null
      - name: Open taxonomy audit PR
        run: |
          bash scripts/open_automation_pr.sh taxonomy "chore(taxonomy): review source audit" data/taxonomy-audit.json
