name: Taxonomy audit
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/organizations.json"
      - "data/education.json"
      - "data/events.json"
      - "scripts/audit_taxonomy.py"
      - ".github/workflows/taxonomy-audit.yml"
  schedule:
    - cron: "11 5 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: dorapp-taxonomy-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate code
        run: |
          python -m py_compile scripts/audit_taxonomy.py
          python -m json.tool data/organizations.json >/dev/null
          python -m json.tool data/education.json >/dev/null
          python -m json.tool data/events.json >/dev/null
      - name: Audit taxonomy against source pages
        run: python scripts/audit_taxonomy.py
      - name: Validate result
        run: python -m json.tool data/taxonomy-audit.json >/dev/null
      - name: Propose taxonomy audit updates as pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DORAPP_PR_TOKEN || github.token }}
          commit-message: "chore(taxonomy): propose source audit refresh"
          branch: automation/taxonomy-audit
          delete-branch: true
          title: "chore(taxonomy): review source audit refresh"
          body: |
            Taxonomy source audit refresh for human review.
            No direct push to main.
          add-paths: |
            data/taxonomy-audit.json
